openapi: 3.1.0
servers:
  - url: "http://localhost:3000/v1"
info:
  title: WASAText
  description: WASAText; "Programmazione per il Web 2025/26"'s project
  version: 0.1.0
tags:
  - name: login
    description: login operations
  - name: set
    description: Operations that let you set something
  - name: groups
    description: Operations that let you manipulate the groups
  - name: get
    description: Get Operations
  - name: delete
    description: Operations that let you delete something
  - name: messages
    description: Operations that are related to messages
  - name: comments
    description: Operations that are related to comments
  - name: forwardedMessages
    description: Operations related to forwardedMessages
security:
  - BearerAuth: []
paths:
  /session:
    post:
      tags: ["login"]
      summary: logs in the user 
      security: []
      description: |- 
        If the user doesnt exit, it will be created, 
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User login request payload
        content:
          application/json:
            schema:
              description: Display name of the user
              type: object
              properties:
                name:
                  type: string
                  description: name used by the user
                  example: Pippo
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
              required: 
                - name
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:  
            application/json:
              schema:
                description: Successful login response
                type: object
                properties:
                  identifier:
                    $ref: '#/components/schemas/UserId'
                required:
                  - identifier
        '400' : { $ref: "#/components/responses/BadRequest" }

    delete:
        tags: ["login"]
        summary: Logout the user
        description: |
          Invalidates the current session token. 
          Effectively logs the user out from the server side.
        operationId: doLogout
        security:
          - BearerAuth: []  
        responses:
          '204':
            description: Logout successful. No content returned.
          '401':
            $ref: '#/components/responses/Unauthorized'

  /users/{userId}/username:
    put:
      summary: set username 
      description: the user set the username that other users will see while texting with him
      operationId: setMyUserName
      tags: ["set"]
      parameters:
        - name: userId
          description: user's id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      requestBody:
        content: 
          application/json:
            schema: 
              type: object
              description: UserName desired
              properties:
                username:
                  description: name used by the user
                  type: string
                  example: Pippox2
                  minLength: 3
                  maxLength: 16
                  pattern: '^[A-Za-z0-9_-]+$'
        required: true
      responses:
        '200':
          description: Username set successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400' : { $ref: "#/components/responses/BadRequest" }

  /users/{userId}/pfp:
    get:
      summary: Ottiene l'URL della foto profilo
      description: Recupera l'URL pubblico della foto profilo di un utente specifico.
      operationId: getPhotoUrl
      tags: ["user_management"]
      parameters:
        - name: userId
          description: ID dell'utente di cui si vuole recuperare la foto profilo.
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: URL della foto profilo recuperato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pfpUrl:
                    type: string
                    format: url
                    description: L'URL pubblico della foto profilo.
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /users/me/pfp:
    put: 
      summary: set profile picture
      description: the user set the profile picture that other users will see while texting with him
      operationId: setMyPhoto
      tags: ["set"]
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              description: profile picture
              properties:
                pfp:
                  description: user's profile picture
                  type: string
                  format: binary
                  pattern: '^.+$'
                  minLength: 1
                  maxLength: 5242880 
        required: true
      responses: 
        '200':
          description: Profile picture set successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400' : { $ref: "#/components/responses/BadRequest" }
        '401' : { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Rimuove la foto profilo
      description: Rimuove l'immagine corrente dell'utente autenticato, tornando all'immagine di default (o a null).
      operationId: deleteMyPhoto
      tags: ["user_management"]
      responses:
        '200':
          description: Foto profilo rimossa con successo. Viene restituito lo stato aggiornato.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pfpUrl:
                    type: string
                    format: url
                    description: L'URL della foto profilo dopo la rimozione (sarà l'URL di default).
        '401' : { $ref: "#/components/responses/Unauthorized" }

  /media:
    post:
      summary: Upload a media file
      description: |
        Uploads an image or file to the server.
        Returns the public URL to be used in the 'POST /messages' endpoint.
      operationId: uploadMedia
      tags: ["set", "messages"]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload (max 5MB)
              required:
                - file
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  mediaId:
                    type: string
                    description: Unique ID of the uploaded file
                  url:
                    type: string
                    format: url
                    description: Public URL of the file
                required:
                  - mediaId
                  - url
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: Payload Too Large - The uploaded file exceeds the maximum allowed size of 5MB.



  /conversations:
      post:
        summary: Start a private conversation
        description: |
          Creates a new private 1-to-1 conversation with another user. 
          **Idempotency:** If a private conversation with this user already exists, the server returns the existing conversation instead of creating a new one.
        operationId: createPrivateConversation
        tags: ["conversations"]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipientId:
                    description: The User ID of the person you want to talk to.
                    $ref: '#/components/schemas/UserId'
                required:
                  - recipientId
        responses:
          '200':
            description: Conversation created or retrieved successfully.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Conversation'
          '404':
            description: Recipient user not found.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/NotFound'
          '400':
            $ref: '#/components/responses/BadRequest'

  /groups:
      post:
        summary: Create a new group
        description: Creates a new group chat with a name and a list of initial participants.
        operationId: createGroup
        tags: ["groups"]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupName:
                    type: string
                    description: The name of the group.
                    minLength: 1
                    maxLength: 30
                    example: "Study Group 2026"
                  participants:
                    type: array
                    description: List of User IDs to add to the group immediately.
                    items:
                      $ref: '#/components/schemas/UserId'
                    minItems: 0
                    maxItems: 100
                required:
                  - groupName
                  - participants
        responses:
          '201':
            description: Group created successfully.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Group'
          '400':
            $ref: '#/components/responses/BadRequest'

  /conversations/{convId}/participants:
    post:
      summary: add a member to the group
      description: add to the array list of the participants of the group an user
      operationId: addToGroup
      tags: ["groups"]
      parameters:
        - name: convId
          description: conversation's id
          in: path
          required: true
          schema: 
            $ref: '#/components/schemas/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: array of the users'id
              properties:
                userIds:
                  description: list of the users' id present in the group chat
                  type: array
                  items:
                    $ref: '#/components/schemas/UserId'
                  minItems: 1
                  maxItems: 20
              required:
                - userIds
      responses:
        '200':
          description: Group updated successfully, with new participants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /conversations/{convId}/participants/me:              
    delete:
      description: Let the user leave a group chat
      operationId: leaveGroup
      summary: leave the group
      tags: ["groups"]
      parameters:
        - name: convId
          in: path
          required: true
          description: conversation's id
          schema: 
            $ref: '#/components/schemas/ConversationId'
      responses:
        '200':
          description: Successfully left the group. Returns the updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /conversations/{convId}/group_photo:
    put:
      summary: set the group photo
      description: the user sets the photo for the group conversation
      operationId: setGroupPhoto
      tags: ["groups", "set"]
      parameters:
        - name: convId
          in: path
          required: true
          description: conversation's id
          schema:
            $ref: '#/components/schemas/ConversationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: photo of the group chat
              properties:
                groupPhoto:
                  description: group chat's photo
                  type: string
                  pattern: '^.+$'
                  minLength: 1
                  maxLength: 5242880 
                  format: binary
      responses: 
        '200':
          description: group photo set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'

  /conversations/{convId}/group_name:
    put:
      operationId: setGroupName
      description: the user sets the group name
      summary: set the group name
      tags: ["set", "groups"]
      parameters:
        - name: convId
          in: path
          required: true
          description: conversation's id
          schema: 
            $ref: '#/components/schemas/ConversationId'
      requestBody:
        required: true 
        content:
          application/json:
            schema:
              type: object
              description: group name to set
              properties:
                groupName:
                  description: group's name that can be modified by the users
                  type: string
                  pattern: '^[A-Za-z0-9_-]+$'
                  minLength: 1
                  maxLength: 16
              required:
                - groupName
      responses: 
        '200':
          description: group name set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
  /conversations/{convId}:
    get:
      summary: get a specific conversation
      description: returns details of a single conversation by its identifier
      operationId: getConversation
      tags: ["groups","get"]
      parameters:
        - name: convId
          description: conversation's id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ConversationId'
      responses:
        '200':
          description: conversation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
  /users/{userId}/conversations:
    get:
      summary: get all the conversations of the user
      description: returns a list of all the user's conversations
      operationId: getMyConversations
      tags: ["get"]
      parameters:
        - name: userId
          in: path
          required: true
          description: user's id
          schema: 
           $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: list of conversations
          content:
            application/json:
              schema:
                type: object
                description: all the conversations of the user
                properties:
                  conversations:
                    description: array of all the conversations of the user
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
                    minItems: 0
                    maxItems: 100
        '404':
          $ref: '#/components/responses/NotFoundResponse'
  /conversations/{convId}/messages/{messageId}:
    delete:
      tags: ["delete", "messages"]
      operationId: deleteMessage
      summary: Mark a message as deleted 
      description: 
        Instead of physically removing the message, sets its status to "deleted".
        The message remains in the conversation data but is treated as removed by clients.
      parameters:
        - name: convId
          in: path
          required: true
          description: conversation's id
          schema:
           $ref: '#/components/schemas/ConversationId'
        - name: messageId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MessageId'
          
      responses:
        '200':
          description: Message marked as deleted, returns the updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                messageId: "xyz123"
                status: "deleted"
                text: "This message has been deleted"
                sender: "pippo456"
                kind: "deleted"
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '400':
          $ref: "#/components/responses/BadRequest"

