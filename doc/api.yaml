openapi: 3.1.0
servers:
  - url: "http://localhost:3000"
info:
  title: WASAText
  description: WASAText; "Programmazione per il Web 2025/26"'s project
  version: 0.0.1

paths:
  /session:
    post:
      tags: ["login"]
      summary: logs in the user 
      description: |- 
        If the user doesnt exit, it will be created, 
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Pippo
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:  
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    example: "ciao12345"
 
  /users/{userId}/username:
    put:
      summary: set username 
      description: the user set the username that other users will see while texting with him
      operationId: setMyUserName
      tags: ["set"]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: UserName desired
        content: 
          application/json:
            schema: 
              type: object
              properties:
                username:
                  type: string
                  example: Pippox2
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '200':
          description: Username set successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400' : { $ref: "#/components/responses/BadRequest" }

  /users/{userId}/pfp:
    put: 
      summary: set profile picture
      description: the user set the profile picture that other users will see while texting with him
      operationId: setMyPhoto
      tags: ["set"]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                pfp:
                  type: string
                  format: binary
        required: true
      responses: 
        '200':
          description: Profile picture set successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400' : { $ref: "#/components/responses/BadRequest" }
    
  /conversations/{convId}/participants:
    post:
      summary: add a member to the group
      operationId: addToGroup
      tags: ["groups"]
      parameters:
        - name: convId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 20
              required:
                - userIds
      responses:
        '200':
          description: Group updated successfully, with new participants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Group not found

  /conversations/{convId}/participants/{userId}:              
    delete:
      operationId: leaveGroup
      summary: leave the group
      tags: ["group"]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: convId
          in: path
          required: true
          schema: 
            type: string
      responses:
        '200':
          description: Successfully left the group. Returns the updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Group or user not found

  /conversations/{convId}/groupPhoto:
    put:
      summary: set the group photo
      description: the user sets the photo for the group conversation
      operationId: setGroupPhoto
      tags: ["groups", "set"]
      parameters:
        - name: convId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                groupPhoto:
                  type: string
                  format: binary
      responses: 
        '200':
          description: group photo set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'

  /conversations/{convId}/groupName:
    put:
      operationId: setGroupName
      description: the user sets the group name
      tags: ["set", "groups"]
      parameters:
        - name: convId
          in: path
          required: true
          schema: 
            type: string
      requestBody:
        required: true 
        content:
          application/json:
            schema:
              type: object
              properties:
                groupName:
                  type: string
                  minLength: 1
                  maxLength: 16
              required:
                - groupName
      responses: 
        '200':
          description: group name set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404': 
            description: "group not found"
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    error:
                      type: string
                      example: "Group not found"
 
  /conversations/{convId}:
    get:
      summary: get a specific conversation
      description: returns details of a single conversation by its identifier
      operationId: getConversation
      tags: ["groups","get"]
      parameters:
        - name: convId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: conversation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          description: conversation not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Conversation not found"

  /users/{userId}/conversations:
    get:
      summary: get all the conversations of the user
      description: returns a list of all the user's conversations
      operationId: getMyConversations
      tags: ["get"]
      parameters:
        - name: userId
          in: path
          required: true
          schema: 
            type: string
      responses:
        '200':
          description: list of conversations
          content:
           application/json:
            schema:
              type: array
              items: 
                $ref: "#/components/schemas/Conversation"
        '404':
          description: conversations not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Conversations not found"

  /conversations/{convId}/messages/messageId:
    delete:
      tags: ["delete", "messages"]
      operationId: deleteMessage
      summary: Mark a message as deleted 
      description: 
        Instead of physically removing the message, sets its status to "deleted".
        The message remains in the conversation data but is treated as removed by clients.
      parameters:
        - name: convId
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message marked as deleted, returns the updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                messageId: "xyz123"
                status: "deleted"
                text: null
                media: null
                sender: "pippo456"
                kind: "deleted"
        '404':
          description: Message not found
        '400':
          $ref: "#/components/responses/BadRequest"

    post: 
      operationId: sendMessage
      tags: ["messages"]
      summary: the user send a message to the conversation
      parameters:
        - name: convId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
      responses:
        '201':
          description: message sent successfully
        '404':
          description: conv not found
        '400':
          $ref: '#/components/responses/BadRequest'

  /conversations/{convId}/messages/{messageId}/forwarded:
    post:
      tags: ["forwardedMessages"]
      summary: Forward an existing message to this conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardedMessage'
            example:
              kind: forwarded
              text: "optional text"
              media:
                url: "https://example.com/file.png"
                filename: "file.png"
                mimeType: "image/png"
                size: 12345
      responses:
        '201':
          description: Message forwarded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardedMessage"
        '404':
          description: Message or conversation not found
        '400':
          $ref: '#/components/responses/BadRequest'

  /conversations/{convId}/messages/{messageId}/comments:
    post:
      operationId: commentMessage
      tags: ["comments"]
      summary: the user comments a specific message of the conversation
      parameters: 
        - name: convId
          in: path
          required: true
          schema: 
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              example:
                kind: comment
                text: "this is a comment"
      responses:
        '201':
          description: Message commented successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        '404':
          description: Message or conversation not found
        '400':
          $ref: '#/components/responses/BadRequest'

  /conversations/{convId}/messages/{messageId}/comments/{commentId}:
    delete:
      operationId: uncommentMessage
      tags: ["delete", "comments"]
      summary: Delete a specific comment from a message
      description: Permanently removes the specified comment or reaction from the message. The operation corresponds to “uncomment” (users can delete their reactions at any time).
      parameters:
        - name: convId
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment marked as deleted, returns the updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        '404':
          description: Comment not found
        '400':
          $ref: "#/components/responses/BadRequest"


                  

components:
  responses:
    BadRequest:   
      description: The request was not compliant with the documentation (eg. missing fields, etc)
  schemas:
    User:
      type: object
      description: User profile in the system
      properties:
        userId:
          type: string
          description: Unique user identifier
        userName:
          type: string
          minLength: 3
          maxLength: 16
          example: Pippox2
        pfp:
          type: string
          format: uri
          description: URL of profile picture
        createdAt:
          type: string
          format: date-time
          description: User creation date
      required:
        - userId
        - userName

    Message:
      type: object
      description: message sent by an user
      properties:
        status:
          type: string
          enum:
            - seen
            - sent
            - sending
            - deleted
        text:
          type: string
          description: testo del messaggio (opzionale)
          minLength: 1
          maxLength: 150
        media:
          $ref: '#/components/schemas/Media'
          description: media del messaggio (opzionale)
        time:
          description: time that message was sent 
          type: string
          format: date-time
          example: "11:23"
        sender:
          description: ID of the sender
          type: string
        messageId:
          type: string
          description: Unique identifier for the message
        kind:
          type: string
          enum: 
            - normal
            - comment
            - forwarded
            - deleted
      anyOf:
        - required: ["text"]
        - required: ["media"]

    Media:
      type: object
      description: Oggetto che rappresenta un'immagine allegata al messaggio
      properties:
        url:
          type: string
          format: uri
          description: URL of image
        filename:
          type: string
          description: file image name
        mimeType:
          type: string
          description: image/png, image/jpeg
        size:
          type: integer
          description: image size in byte
      required:
        - url
        - mimeType

    Conversation: 
      type: object
      properties:
        convId: 
          type: string
          example: g2074f-f34567
          description: "Conversation identifier"

        participants:
          type:
            array
          items: 
            description: List of ID of the users that participate the conversation
            type: string
        messages:
          type:
            array
          items:
            description: List of messages sent by the users
    
    Group:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          description: conversation with at least 2 users or more with option to set a name and a pic 
          properties:
            groupName:
              type: string
              description: Group name
              default: "New Group"
            groupPhoto: 
              type: string
              format: binary              
            participants:
              type: array
              items:
                type: string
              minItems: 2     
              maxItems: 100
          required:
            - participants  
            
    Comment:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          properties:
            kind:
              type: string
              enum: [comment]
              default: comment
          required:
            - kind

    ForwardedMessage:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          properties:
            kind:
              type: string
              enum: [forwarded]
              default: forwarded
          required:
            - kind
