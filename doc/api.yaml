openapi: 3.0.0
servers:
  - url: "http://localhost:3000"
info:
  title: WASAText
  description: WASAText; "Programmazione per il Web 2025/26"'s project
  version: 0.0.1
  paths:
    /session:
      post:
        tags: ["login"]
        summary: logs in the user 
        description: |- 
          If the user doesnt exit, it will be created, 
          and an identifier is returned.
          If the user exists, the user identifier is returned.
        operationID: doLogin
        requestBody:
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Pippo
                    pattern: '^.*?$'
                    minLength: 3
                    maxLength: 16
          required: true
        responses:
          '201':
            description: User log-in action successful
            content:  
              application/json:
                schema:
                  type: object
                  properties:
                    identifier:
                      type: string
                      example: "ciao12345"
                


