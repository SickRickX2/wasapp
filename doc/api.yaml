openapi: 3.1.0
servers:
  - url: "http://localhost:3000"
info:
  title: WASAText
  description: WASAText; "Programmazione per il Web 2025/26"'s project
  version: 0.0.1
paths:
  /session:
    post:
      tags: ["login"]
      summary: logs in the user 
      description: |- 
        If the user doesnt exit, it will be created, 
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Pippo
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:  
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "ciao12345"
  /users/{userId}/username:
    put:
      summary: set username 
      description: the user set the username that other users will see while texting with him
      operationId: setMyUserName
      tags: ["set"]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: UserName desired
        content: 
          application/json:
            schema: 
              type: object
              properties:
                UserName:
                  type: string
                  example: Pippox2
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '200':
          description: Username set successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400' : { $ref: "#/components/responses/BadRequest" }

  /users/{userId}/pfp:
    put: 
      summary: set profile picture
      description: the user set the profile picture that other users will see while texting with him
      operationId: setMyPhoto
      tags: ["set"]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                pfp:
                  type: string
                  format: binary
        required: true
      responses: 
        '200':
          description: Profile picture set successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400' : { $ref: "#/components/responses/BadRequest" }
    
  /conversations/{convId}/participants:
    post:
      summary: add a member to the group
      operationId: addToGroup
      tags: ["groups"]
      parameters:
        - name: convId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 20
              required:
                - userIds

  /conversations/{convId}/groupPhoto:
    put:
      summary: set the group photo
      description: the user sets the photo for the group conversation
      operationId: setGroupPhoto
      tags: ["groups", "set"]
      parameters:
        - name: convId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                groupPhoto:
                  type: string
                  format: binary
      responses: 
        '200':
          description: group photo set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
  
  /conversations/{convId}:
    get:
      summary: get a specific conversation
      description: returns details of a single conversation by its identifier
      operationId: getConversation
      tags: ["groups"]
      parameters:
        - name: convId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: conversation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          description: conversation not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Conversation not found"

                  

components:
  responses:
    BadRequest:   
      description: The request was not compliant with the documentation (eg. missing fields, etc)
  schemas:
    User:
      type: object
      description: User profile in the system
      properties:
        userId:
          type: string
          description: Unique user identifier
        userName:
          type: string
          minLength: 3
          maxLength: 16
          example: Pippox2
        pfp:
          type: string
          format: uri
          description: URL of profile picture
        createdAt:
          type: string
          format: date-time
          description: User creation date
      required:
        - userId
        - userName

    Message:
      type: object
      description: message sent by an user
      properties:
        status:
          type: string
          enum:
            - "seen"
            - "sent"
            - "sending"
        text:
          type: string
          description: testo del messaggio (opzionale)
          minLength: 1
          maxLength: 150
        media:
          $ref: '#/components/schemas/Media'
          description: media del messaggio (opzionale)
        time:
          description: time that message was sent 
          type: string
          format: date-time
          example: "11:23"
        sender:
          description: the user who sent the message
          $ref: "#users/{userId}/username"   
      anyOf:
        - required: ["text"]
        - required: ["media"]

    Media:
      type: object
      description: Oggetto che rappresenta un'immagine allegata al messaggio
      properties:
        url:
          type: string
          format: uri
          description: URL of image
        filename:
          type: string
          description: file image name
        mimeType:
          type: string
          description: image/png, image/jpeg
        size:
          type: integer
          description: image size in byte
      required:
        - url
        - mimeType

    Conversation: 
      type: object
      properties:
        convId: 
          type: string
          example: g2074f-f34567
          description: "Conversation identifier"

        participants:
          type:
            array
          items: 
            description: List of ID of the users that participate the conversation
            type: string
        messages:
          type:
            array
          items:
            description: List of messages sent by the users
    
    Group:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          description: conversation with at least 2 users or more with option to set a name and a pic 
          properties:
            groupName:
              type: string
              description: Group name
              default: "New Group"
            groupPhoto: 
              type: string
              format: binary              
            participants:
              type: array
              items:
                type: string
              minItems: 2     
              maxItems: 100
          required:
            - participants

          
    






